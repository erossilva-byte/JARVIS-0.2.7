name: Build e testes do J.A.R.V.I.S. Nova

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'JARVIS-NOVA-1.2.6-fonte.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

concurrency:
  group: jarvis-nova-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Testar e compilar APK debug
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Configurar Java para o Android
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Extrair código-fonte 1.2.6
        run: |
          test -f JARVIS-NOVA-1.2.6-fonte.zip || { echo 'Envie JARVIS-NOVA-1.2.6-fonte.zip para a raiz do repositório.'; exit 1; }
          mkdir -p /tmp/jarvis-source
          unzip -q JARVIS-NOVA-1.2.6-fonte.zip -d /tmp/jarvis-source
          SRC=/tmp/jarvis-source/JARVIS-NOVA
          test -f "$SRC/package.json"
          find "$SRC" -mindepth 1 -maxdepth 1 ! -name '.github' -exec cp -a {} . \;
          test -f package.json
      - name: Instalar dependências Node
        run: npm install --ignore-scripts --legacy-peer-deps
      - name: Testes estáticos e regressão
        run: npm run test:all
      - name: Preparar os recursos web do aplicativo
        run: |
          mkdir -p www
          cp index.html style.css app.js apps.js www/
      - name: Gerar estrutura nativa do Android
        run: |
          npx cap add android
          npx cap sync android
      - name: Aplicar dependência nativa Porcupine
        run: python3 patch_gradle.py android/app/build.gradle
      - name: Aplicar identidade, permissões e versão nativas
        run: |
          D=android/app/src/main/java/com/jarvis/nova
          mkdir -p "$D"
          cp MainActivity.java JarvisBackgroundPlugin.java JarvisService.java JarvisUtilPlugin.java JarvisAlarmReceiver.java JarvisAlarmScheduler.java JarvisBootReceiver.java JarvisNotificationListener.java "$D/"
          python3 patch_manifest.py android/app/src/main/AndroidManifest.xml
          python3 patch_android_version.py android/app/build.gradle VERSAO.json
          python3 patch_visual.py android
      - name: Compilar APK debug
        working-directory: android
        run: |
          chmod +x gradlew
          if ! ./gradlew assembleDebug --no-daemon; then
            echo "Primeira compilação falhou; tentando novamente sem as personalizações de splash/ícone."
            python3 ../patch_visual.py . desfazer
            ./gradlew assembleDebug --no-daemon
          fi
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee apk-sha256.txt
      - name: Publicar APK e checksum
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Nova-1.2.6-APK
          if-no-files-found: error
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/apk-sha256.txt
          retention-days: 14
